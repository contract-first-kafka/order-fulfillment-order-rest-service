quarkus.banner.enabled = false
quarkus.management.enabled = true
quarkus.management.port = 9000
quarkus.native.resources.includes=order-rest-api.json
quarkus.camel.openapi.codegen.model-package=io.github.contractfirstkafka.demo.orderfulfillment.orderrest

camel.context.name = order-rest
camel.component.rest-openapi.mockIncludePattern = file:camel-mock/**,classpath:camel-mock/**
camel.rest.bindingPackageScan=${quarkus.camel.openapi.codegen.model-package}
camel.rest.bindingMode=json
